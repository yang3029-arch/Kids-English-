<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>英文小耳朵</title>
<style>
  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --ink: #1d1d1f;
    --muted: #8e8e93;
    --line: #e5e4df;
    --accent: #ff6b35;
    --accent-press: #e95a26;
    --accent-soft: #fff1ea;
    --ok: #20a464;
    --ok-soft: #e9f7f0;
    --bad: #e5484d;
    --bad-soft: #fdeeee;
    --star: #f5b400;
    --radius: 24px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    color: var(--ink); background: var(--bg);
    user-select: none; -webkit-user-select: none; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; border: 0; cursor: pointer; color: inherit; background: none; touch-action: manipulation; }
  .muted { color: var(--muted); }
  .screen { display: none; min-height: 100vh; min-height: 100dvh; padding: 24px 16px 32px; }
  .screen.active { display: flex; flex-direction: column; align-items: center; }
  .wrap { width: 100%; max-width: 860px; }

  /* ---------- 按鈕 ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 72px; padding: 0 36px; border-radius: 20px;
    font-size: 24px; font-weight: 600; letter-spacing: .5px;
    background: var(--accent); color: #fff; transition: transform .1s, background .15s;
  }
  .btn:active { transform: scale(.97); background: var(--accent-press); }
  .btn.ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
  .btn.ghost:active { background: #f0efea; }
  .btn.dark { background: var(--ink); }
  .btn.small { min-height: 56px; padding: 0 24px; font-size: 20px; border-radius: 16px; }
  .icon-btn {
    width: 60px; height: 60px; flex: none; border-radius: 50%; font-size: 30px; line-height: 1;
    background: var(--surface); border: 2px solid var(--line); color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { transform: scale(.94); }
  .link-btn { font-size: 20px; color: var(--muted); padding: 14px 20px; text-decoration: underline; text-underline-offset: 4px; }

  /* ---------- 首頁 ---------- */
  #home { justify-content: center; }
  .home { width: min(560px, 100%); display: flex; flex-direction: column; gap: 32px; }
  .home-head h1 { margin: 0; font-size: 44px; font-weight: 800; letter-spacing: 2px; }
  .home-head p { margin: 8px 0 0; font-size: 20px; }
  .home-head .stars { color: var(--star); }
  .mode-list { display: flex; flex-direction: column; gap: 12px; }
  .mode {
    display: flex; align-items: center; gap: 18px; text-align: left; width: 100%;
    min-height: 92px; padding: 14px 20px; border-radius: var(--radius);
    background: var(--surface); border: 2px solid var(--line); transition: transform .1s, border-color .15s;
  }
  .mode:active { transform: scale(.98); border-color: var(--accent); }
  .mode-ico {
    width: 56px; height: 56px; flex: none; border-radius: 16px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; font-size: 28px;
  }
  .mode-txt { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .mode-txt b { font-size: 24px; font-weight: 700; }
  .mode-txt small { font-size: 17px; color: var(--muted); }
  .chev { font-size: 36px; color: #c7c7cc; line-height: 1; }
  .settings { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .set-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 76px; border-bottom: 1px solid var(--line); font-size: 22px; font-weight: 600;
  }
  .switch {
    appearance: none; -webkit-appearance: none; margin: 0; flex: none; cursor: pointer;
    width: 64px; height: 38px; border-radius: 999px; background: #dcdcd7; position: relative; transition: background .2s;
  }
  .switch::after {
    content: ""; position: absolute; top: 4px; left: 4px; width: 30px; height: 30px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s;
  }
  .switch:checked { background: var(--ok); }
  .switch:checked::after { transform: translateX(26px); }
  .seg { display: inline-flex; background: #eceae4; border-radius: 14px; padding: 4px; }
  .seg button { min-width: 56px; min-height: 48px; padding: 0 12px; border-radius: 11px; font-size: 20px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .home .link-btn { align-self: center; }

  /* ---------- 頂部列 ---------- */
  .topbar { width: 100%; max-width: 860px; display: flex; align-items: center; gap: 16px; }
  .topbar h2 { flex: 1; margin: 0; text-align: center; font-size: 26px; font-weight: 700; }
  .progress-wrap { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .progress-label { font-size: 17px; color: var(--muted); font-weight: 600; text-align: center; }
  .progress { height: 8px; background: #e8e7e2; border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--ok); border-radius: 999px; transition: width .4s; }
  .star-count { min-width: 60px; text-align: right; font-size: 24px; font-weight: 700; color: var(--star); white-space: nowrap; }
  .star-count.pop { animation: pop .45s; }

  /* ---------- 題目 ---------- */
  .speaker-zone { margin: 28px 0 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .speaker-row { display: flex; gap: 16px; align-items: center; }
  .speaker {
    width: 132px; height: 132px; border-radius: 50%; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; transition: transform .1s;
  }
  .speaker svg { width: 56px; height: 56px; }
  .speaker:active { transform: scale(.95); background: var(--accent-press); }
  .speaker.talking { animation: pulse .9s ease-in-out infinite; }
  .speaker.sm { width: 96px; height: 96px; }
  .speaker.sm svg { width: 42px; height: 42px; }
  .slow-btn {
    min-height: 52px; padding: 0 20px; border-radius: 999px; font-size: 18px; font-weight: 600;
    background: var(--surface); border: 2px solid var(--line); color: var(--muted);
  }
  .slow-btn:active { transform: scale(.95); }
  .hint { font-size: 20px; color: var(--muted); min-height: 30px; font-weight: 600; text-align: center; }
  .hint.good { color: var(--ok); }
  .hint.bad { color: var(--bad); }

  .choices {
    width: 100%; max-width: min(760px, max(300px, calc(100vh - 640px)));
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  .choice {
    position: relative; aspect-ratio: 1 / 1; border-radius: var(--radius);
    background: var(--surface); border: 2px solid var(--line); padding: 16px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    transition: transform .1s, border-color .2s, background .2s, opacity .2s;
  }
  .choice:active { transform: scale(.97); }
  .choice img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; pointer-events: none; }
  .txt-fallback { font-size: clamp(32px, 8vw, 60px); font-weight: 700; color: var(--muted); }
  .choice .word-tag {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    background: var(--surface); border-radius: 999px; padding: 2px 18px;
    font-size: 26px; font-weight: 700; display: none; border: 2px solid currentColor;
  }
  .choice .mark {
    position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%;
    display: none; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: #fff;
  }
  .choice.correct, .choice.reveal { border-color: var(--ok); background: var(--ok-soft); }
  .choice.correct { animation: pop .45s; }
  .choice.correct .word-tag, .choice.reveal .word-tag { display: block; color: var(--ok); }
  .choice.correct .mark, .choice.reveal .mark { display: flex; background: var(--ok); }
  .choice.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .4s; }
  .choice.wrong .word-tag { display: block; color: var(--bad); }
  .choice.wrong .mark { display: flex; background: var(--bad); }
  .choice.dim { opacity: .35; }
  .choice.loading::after {
    content: ""; width: 44px; height: 44px; border-radius: 50%;
    border: 4px solid var(--line); border-top-color: var(--muted); animation: spin 1s linear infinite;
  }
  .choices.words .choice { aspect-ratio: auto; min-height: 120px; }
  .choices.words .word-tag { display: none !important; }
  .choice .word-big { font-size: clamp(38px, 7vw, 60px); font-weight: 700; letter-spacing: 1px; pointer-events: none; }

  /* 聽音拼字 */
  .spell { display: none; width: 100%; max-width: 600px; flex-direction: column; align-items: center; gap: 16px; }
  .spell.show { display: flex; }
  .spell-input {
    width: 100%; min-height: 104px; text-align: center; font: inherit; font-size: 56px; font-weight: 700;
    letter-spacing: 6px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface);
    color: var(--ink); user-select: text; -webkit-user-select: text; transition: border-color .2s, background .2s;
  }
  .spell-input::placeholder { font-size: 24px; letter-spacing: 0; color: #c7c7cc; font-weight: 500; }
  .spell-input:focus { outline: none; border-color: var(--ink); }
  .spell-input.right { border-color: var(--ok); background: var(--ok-soft); animation: pop .45s; }
  .spell-input.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .4s; }
  .spell-feedback { font-size: 24px; font-weight: 600; text-align: center; line-height: 1.7; min-height: 40px; color: var(--muted); }
  .spell-feedback .ans { font-size: 44px; letter-spacing: 3px; }
  .spell-feedback .ok { color: var(--ok); }
  .spell-feedback .bad { color: var(--bad); text-decoration: underline; text-underline-offset: 6px; }
  /* ---------- 拼圖 ---------- */
  .game-foot {
    width: 100%; max-width: 760px; margin-top: 20px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  }
  .pz-label { font-size: 18px; font-weight: 600; color: var(--muted); }
  .next-slot { justify-self: end; }
  .puzzle { position: relative; height: clamp(120px, calc(100vh - 950px), 230px); aspect-ratio: 520 / 515; }
  .puzzle.big { height: 230px; }
  .choices.words ~ .game-foot .puzzle { height: clamp(160px, calc(100vh - 640px), 300px); }
  .pz-shadow, .pz-piece { position: absolute; inset: 0; background: var(--pz) center / 100% 100% no-repeat; }
  .pz-shadow { filter: brightness(0); opacity: .08; }
  .pz-piece { opacity: 0; }
  .pz-piece.on { opacity: 1; }
  .pz-piece.new { animation: pieceIn .9s cubic-bezier(.2,.9,.3,1.25); }
  .puzzle.done { animation: cheer 1s ease; }
  @keyframes pieceIn {
    0% { opacity: 0; transform: translateY(-60%) scale(1.6) rotate(-12deg); }
    50% { opacity: 1; }
    100% { opacity: 1; transform: none; }
  }
  @keyframes cheer { 0%,100% { transform: none; } 25% { transform: scale(1.12) rotate(-4deg); } 50% { transform: scale(1.12) rotate(4deg); } 75% { transform: scale(1.06); } }

  /* ---------- 單字卡 ---------- */
  .flash-wrap { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px 0; }
  .flashcard {
    width: min(520px, 88vw, calc((100vh - 330px) * .8)); min-width: 240px; aspect-ratio: 4 / 5;
    perspective: 1400px; cursor: pointer; touch-action: pan-y;
  }
  .flash-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,.7,.3,1); }
  .flashcard.flipped .flash-inner { transform: rotateY(180deg); }
  .flashcard.instant .flash-inner { transition: none; }
  .face {
    position: absolute; inset: 0; border-radius: 32px; background: var(--surface); border: 2px solid var(--line);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center; padding: 32px;
  }
  .face.back { transform: rotateY(180deg); flex-direction: column; gap: 12px; }
  .flash-pic { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .flash-pic img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 16px; }
  .flash-word { font-size: clamp(56px, 14vw, 104px); font-weight: 800; letter-spacing: 2px; }
  .flash-tip { font-size: 18px; }
  .card-ctrls { display: flex; align-items: center; gap: 28px; padding-bottom: 8px; }
  .card-ctrls .icon-btn { width: 76px; height: 76px; font-size: 40px; }

  /* ---------- 結算 ---------- */
  #result { justify-content: center; }
  .result-card { width: min(560px, 100%); display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
  .result-title { font-size: 36px; font-weight: 800; }
  .result-stars { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; font-size: 40px; line-height: 1; color: #e2e1dc; }
  .result-stars span.on { color: var(--star); animation: pop .5s backwards; }
  .result-msg { font-size: 20px; color: var(--muted); }
  .wrong-box { width: 100%; display: none; padding: 18px; border-radius: var(--radius); background: var(--surface); border: 2px solid var(--line); }
  .wrong-title { font-size: 17px; font-weight: 600; color: var(--muted); margin-bottom: 12px; }
  .wrong-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .wrong-list button {
    min-height: 52px; padding: 0 20px; border-radius: 999px; font-size: 26px; font-weight: 700;
    color: var(--bad); background: var(--bad-soft);
  }
  .result-btns { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 6px; }

  /* ---------- 題庫 ---------- */
  .panel { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 22px; margin-top: 16px; }
  .panel h3 { margin: 0 0 10px; font-size: 22px; font-weight: 700; }
  .panel p.note { margin: 0 0 14px; color: var(--muted); font-size: 17px; line-height: 1.6; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .text-input, textarea {
    font: inherit; font-size: 24px; border: 2px solid var(--line); border-radius: 16px; padding: 12px 16px;
    background: var(--bg); color: var(--ink); user-select: text; -webkit-user-select: text;
  }
  .text-input { flex: 1; min-width: 180px; min-height: 56px; }
  textarea { width: 100%; min-height: 110px; resize: vertical; }
  .text-input:focus, textarea:focus { outline: none; border-color: var(--ink); }
  .photo-preview { max-width: 100%; max-height: 240px; border-radius: 16px; margin: 12px 0; display: none; }
  .ocr-status { font-size: 18px; color: var(--muted); margin: 8px 0; min-height: 26px; }
  .bank-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .bank-item { border-radius: 18px; padding: 10px; text-align: center; border: 2px solid var(--line); }
  .bank-item .thumb { width: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; }
  .bank-item .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }
  .bank-item .thumb .txt-fallback { font-size: 30px; }
  .bank-item .w { font-size: 24px; font-weight: 700; margin: 6px 0 8px; }
  .bank-item .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .bank-item .acts button { min-height: 44px; border-radius: 12px; font-size: 16px; font-weight: 600; background: var(--bg); color: var(--ink); }
  .bank-item .acts button[data-act="del"] { color: var(--bad); }
  .bank-count { font-size: 18px; color: var(--muted); margin-bottom: 6px; }

  /* ---------- 特效 ---------- */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  .banner {
    position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(0); z-index: 60; pointer-events: none;
    background: var(--ink); color: #fff; font-size: clamp(28px, 6vw, 44px); font-weight: 700;
    padding: 20px 40px; border-radius: 999px; width: max-content; max-width: 90vw; text-align: center;
  }
  .banner.show { animation: bannerIn 1.8s ease forwards; }
  .fly-star { position: fixed; font-size: 56px; line-height: 1; color: var(--star); z-index: 55; pointer-events: none; transition: all .7s cubic-bezier(.5,-0.3,.7,1); }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 80; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--surface); border-radius: 28px; padding: 28px; width: min(480px, 100%); text-align: center; }
  .modal p { font-size: 22px; font-weight: 600; margin: 0 0 22px; line-height: 1.5; }
  .modal .row { justify-content: center; }

  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bannerIn {
    0% { transform: translate(-50%, -50%) scale(.6); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
    25% { transform: translate(-50%, -50%) scale(1); }
    80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -60%) scale(1); opacity: 0; }
  }

  @media (max-width: 560px) {
    .puzzle { height: 120px; }
    .puzzle.big { height: 190px; }
    .pz-label { font-size: 15px; }
    .home-head h1 { font-size: 36px; }
    .speaker { width: 112px; height: 112px; }
    .choices { gap: 10px; }
  }
  @media (orientation: landscape) and (min-width: 900px) and (max-height: 820px) {
    .choices { grid-template-columns: repeat(4, 1fr); max-width: 1100px; }
    .speaker-zone { margin: 16px 0; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-speaker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/>
    <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
    <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
  </symbol>
</svg>

<!-- 首頁 -->
<section id="home" class="screen active">
  <div class="home">
    <header class="home-head">
      <h1>英文小耳朵</h1>
      <p class="muted">第 <span id="homeLevel">1</span> 關　<span class="stars">★</span> <span id="homeStars">0</span></p>
    </header>

    <nav class="mode-list" id="modeBtns">
      <button class="mode" data-mode="cards">
        <span class="mode-ico">🃏</span>
        <span class="mode-txt"><b>單字卡</b><small>看圖、聽發音，翻面看拼字</small></span>
        <span class="chev">›</span>
      </button>
      <button class="mode" data-mode="pic">
        <span class="mode-ico">🖼️</span>
        <span class="mode-txt"><b>聽音選圖</b><small>聽單字，選出正確的圖片</small></span>
        <span class="chev">›</span>
      </button>
      <button class="mode" data-mode="word">
        <span class="mode-ico">🔤</span>
        <span class="mode-txt"><b>聽音選字</b><small>聽單字，選出正確的拼字</small></span>
        <span class="chev">›</span>
      </button>
      <button class="mode" data-mode="spell">
        <span class="mode-ico">⌨️</span>
        <span class="mode-txt"><b>聽音拼字</b><small>聽單字，自己打出來</small></span>
        <span class="chev">›</span>
      </button>
    </nav>

    <div class="settings">
      <label class="set-row">慢速發音 <input type="checkbox" class="switch" id="slowChk"></label>
      <div class="set-row">
        <span>題數</span>
        <div class="seg" id="countSeg">
          <button data-n="5">5</button>
          <button data-n="10">10</button>
          <button data-n="15">15</button>
          <button data-n="20">20</button>
        </div>
      </div>
    </div>

    <button class="link-btn" id="btnBank">題庫管理</button>
  </div>
</section>

<!-- 單字卡 -->
<section id="cards" class="screen">
  <div class="topbar">
    <button class="icon-btn" id="btnCardsBack" aria-label="回首頁">×</button>
    <div class="progress-wrap">
      <div class="progress-label" id="cardPos">1 / 20</div>
      <div class="progress"><div id="cardBar"></div></div>
    </div>
    <button class="icon-btn" id="btnCardShuffle" aria-label="洗牌" style="font-size:24px">⇄</button>
  </div>
  <div class="flash-wrap">
    <div class="flashcard" id="flashcard">
      <div class="flash-inner">
        <div class="face front"><div class="flash-pic" id="cardPic"></div></div>
        <div class="face back"><div class="flash-word" id="cardWord"></div></div>
      </div>
    </div>
    <div class="flash-tip muted">點卡片翻面，左右滑動換卡</div>
  </div>
  <div class="card-ctrls">

<!-- 遊戲 -->
<section id="game" class="screen">
  <div class="topbar">
    <button class="icon-btn" id="btnHome" aria-label="回首頁">×</button>
    <div class="progress-wrap">
      <div class="progress-label"><span id="gLevel">第 1 關</span> · <span id="gQ">1</span> / <span id="gTotal">10</span></div>
      <div class="progress"><div id="gBar"></div></div>
    </div>
    <div class="star-count" id="gStars">★ 0</div>
  </div>

  <div class="speaker-zone">
    <div class="speaker-row">
      <button class="speaker" id="btnSpeak" aria-label="再聽一次"><svg><use href="#i-speaker"/></svg></button>
    </div>
    <button class="slow-btn" id="btnSlow">慢速再聽</button>
    <div class="hint" id="hint"></div>
  </div>

  <div class="choices" id="choices"></div>
  <div class="spell" id="spell">
    <input class="spell-input" id="spellInput" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="打出聽到的單字">
    <button class="btn dark small" id="btnSpellOk">確認（Enter）</button>
    <div class="spell-feedback" id="spellFeedback"></div>
  </div>
  <div class="game-foot">
    <div class="pz-label" id="gPzLabel"></div>
    <div class="puzzle" id="gPuzzle" aria-label="拼圖"></div>
    <div class="next-slot"><button class="btn" id="btnNext" style="display:none">下一題</button></div>
  </div>
</section>

<!-- 結算 -->
<section id="result" class="screen">
  <div class="result-card">
    <div class="puzzle big" id="rPuzzle" aria-label="拼圖"></div>
    <div class="pz-label" id="rPzLabel"></div>
    <div class="result-title" id="rTitle"></div>
    <div class="result-stars" id="rStars"></div>
    <div class="result-msg" id="rMsg"></div>
    <div class="wrong-box" id="wrongBox">
      <div class="wrong-title">答錯的單字 · 點一下聽發音</div>
      <div class="wrong-list" id="wrongList"></div>
    </div>
    <div class="result-btns">
      <button class="btn" id="btnReview">只練答錯的</button>
      <button class="btn dark" id="btnNextLevel">下一關</button>
      <button class="btn ghost" id="btnRetry">再玩一次</button>
      <button class="link-btn" id="btnResultHome">回首頁</button>
    </div>
  </div>
</section>

<!-- 題庫管理 -->
<section id="bank" class="screen">

    <div class="topbar">

  const TWEMOJI = code => `https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/${code}.svg`;

  /* ================= 儲存 ================= */

  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem('kidsEng.' + key); return v == null ? fallback : JSON.parse(v); }
      catch { return fallback; }
    },
    set(key, val) {

  // 題庫項目：{ word, img? }   img 為家長自訂圖片網址
  let bank = store.get('bank', null) || DEFAULT_WORDS.map(word => ({ word }));

  const saveCache = () => store.set('imgCache', imgCache);

  /* ================= 圖片 ================= */

  const pending = {};
  async function searchOpenverse(query) {
    const url = `https://api.openverse.org/v1/images/?q=${encodeURIComponent(query)}&page_size=10&mature=false`;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) return [];
      const data = await res.json();
      return (data.results || []).map(r => r.thumbnail || r.url).filter(Boolean);
    } catch { return []; }
    finally { clearTimeout(timer); }
  }

  // 回傳圖片網址清單（第一張為目前使用的）
  async function getImageList(item) {
    const word = item.word;
    if (item.img) return [item.img];
    const pic = PICTURES[word];
    const cached = imgCache[word];
    if (cached && cached.list.length) return rotate(cached.list, cached.i);
    if (pic && pic.e && !pic.q) return [TWEMOJI(pic.e)];

    if (!pending[word]) {
      pending[word] = (async () => {
        const list = await searchOpenverse(pic && pic.q ? pic.q : word);
        if (list.length) { imgCache[word] = { list, i: 0 }; saveCache(); }
        return list;
      })().finally(() => { delete pending[word]; });
    }
    const list = await pending[word];
    if (list.length) return list;
    return pic && pic.e ? [TWEMOJI(pic.e)] : [];
  }
  const rotate = (list, i) => list.slice(i).concat(list.slice(0, i));

  // 依序嘗試清單中的圖片，全部失敗就顯示文字
  function renderPicture(container, list, word) {
    container.querySelectorAll('img, .txt-fallback').forEach(n => n.remove());
    return new Promise(resolve => {
      const tryAt = idx => {
        if (idx >= list.length) {
          const t = document.createElement('div');
          t.className = 'txt-fallback';
          t.textContent = word;
          container.prepend(t);
          return resolve(false);
        }
        const img = new Image();
        img.alt = '';
        img.draggable = false;
        img.onload = () => { container.prepend(img); resolve(true); };
        img.onerror = () => tryAt(idx + 1);
        img.src = list[idx];
      };
      tryAt(0);
    });
  }

  /* ================= 語音 ================= */

  let voice = null;
  function pickVoice() {
    const voices = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
    const prefer = [/samantha/i, /google us english/i, /aria/i, /jenny/i, /karen/i, /en[-_]US/i];
    for (const p of prefer) {
      const v = voices.find(v => p.test(v.name) || p.test(v.lang));
      if (v) return (voice = v);
    }
    voice = voices[0] || null;
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }

  // iOS 需要在按鈕點擊當下先發一次聲，之後自動朗讀才不會被擋
  function unlockSpeech() {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  }

  function speak(text, slow = false) {
    if (!('speechSynthesis' in window)) {
      setHint('這台裝置不支援語音朗讀', 'bad');
      return;
    }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    if (voice) u.voice = voice;
    u.rate = slow ? 0.5 : slowMode ? 0.6 : 0.85;
    u.pitch = 1.05;
    const btns = document.querySelectorAll('.speaker');
    u.onstart = () => btns.forEach(b => b.classList.add('talking'));
    u.onend = u.onerror = () => btns.forEach(b => b.classList.remove('talking'));
    speechSynthesis.speak(u);
  }

  /* ================= 音效 ================= */

  let actx = null;
  function tone(freqs, dur = 0.12, type = 'sine', gap = 0.09) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      freqs.forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        const t = actx.currentTime + i * gap;
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(actx.destination);
        o.start(t); o.stop(t + dur + 0.05);
      });
    } catch {}
  }
  const sfx = {
    good: () => tone([660, 880, 1320], 0.18, 'triangle'),
    bad: () => tone([300, 220], 0.22, 'square', 0.15),
    combo: () => tone([523, 659, 784, 1047, 1319], 0.2, 'triangle', 0.08),
    win: () => tone([523, 659, 784, 1047, 784, 1047], 0.25, 'triangle', 0.13),
  };

  /* ================= 彩帶特效 ================= */

  const canvas = $('#fx'), ctx = canvas.getContext('2d');
  let particles = [], fxRunning = false;
  function resize() { canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; }
  addEventListener('resize', resize); resize();

  function confetti(x, y, count = 60, spread = 1) {
    const colors = ['#ff8a3d', '#ffc53d', '#3cc480', '#4aa8e8', '#ff5d9e', '#a77bff'];
    const d = devicePixelRatio;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = (4 + Math.random() * 9) * spread;
      particles.push({
        x: x * d, y: y * d, vx: Math.cos(a) * s * d, vy: (Math.sin(a) * s - 7) * d,
        w: (8 + Math.random() * 8) * d, h: (5 + Math.random() * 6) * d,
        r: Math.random() * 6, vr: (Math.random() - .5) * .4,
        c: colors[i % colors.length], life: 90 + Math.random() * 40,
        star: Math.random() < .25
      });
    }
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(tick); }
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const d = devicePixelRatio;
    particles = particles.filter(p => p.life > 0 && p.y < canvas.height + 40);
    for (const p of particles) {
      p.vy += 0.35 * d; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life / 30);
      ctx.fillStyle = p.c;
      if (p.star) { ctx.font = `${p.w * 2}px sans-serif`; ctx.fillText('★', -p.w, p.w); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (particles.length) requestAnimationFrame(tick);
    else { fxRunning = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }

  function showBanner(text) {

    const s = document.createElement('div');

    s.style.left = (from.left + from.width / 2 - 32) + 'px';
    s.style.top = (from.top + from.height / 2 - 32) + 'px';
    document.body.appendChild(s);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      s.style.left = (to.left + to.width / 2 - 32) + 'px';
      s.style.top = (to.top + to.height / 2 - 32) + 'px';
      s.style.transform = 'scale(.5) rotate(360deg)';
    }));
    setTimeout(() => {
      s.remove();
      const c = $('#gStars'); c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
    }, 720);
  }

  function renderPuzzle(el, n, newIdx = -1) {
    if (!el.childElementCount) {
      el.style.setProperty('--pz', `url(${PUZZLE_IMG})`);
      el.innerHTML = '<div class="pz-shadow"></div>' +
        PUZZLE_PIECES.map(p => `<div class="pz-piece" style="clip-path:${p};-webkit-clip-path:${p}"></div>`).join('');
    }
    el.querySelectorAll('.pz-piece').forEach((piece, i) => {
      piece.classList.toggle('on', i < n);
      piece.classList.remove('new');
      if (i === newIdx) { void piece.offsetWidth; piece.classList.add('new'); }
    });
    el.classList.remove('done');
  }

  function puzzleLabel() {
    const total = PUZZLE_PIECES.length;
    return puzzle.n >= total ? `拼好了！共 ${puzzle.done} 個` : `拼圖 ${puzzle.n} / ${total}`;
  }

  // 答對一題：拼上一塊；全部拼好時回傳 true
  function addPuzzlePiece() {
    const total = PUZZLE_PIECES.length;
    if (puzzle.n >= total) puzzle.n = 0;   // 上一個已拼好，開始拼新的一個
    puzzle.n++;
    if (puzzle.n === total) puzzle.done++;
    store.set('puzzle', puzzle);
    const el = $('#gPuzzle');
    renderPuzzle(el, puzzle.n, puzzle.n - 1);
    $('#gPzLabel').textContent = puzzleLabel();
    if (puzzle.n === total) {
      setTimeout(() => { void el.offsetWidth; el.classList.add('done'); }, 700);
      return true;
    }
    return false;
  }

  /* ================= 首頁 ================= */

  function renderHome() {
    $('#homeLevel').textContent = level;
    $('#homeStars').textContent = totalStars;
    $('#slowChk').checked = slowMode;
    document.querySelectorAll('#countSeg button').forEach(b => b.classList.toggle('on', +b.dataset.n === qCount));
  }
  $('#slowChk').addEventListener('change', e => {
    slowMode = e.target.checked; store.set('slow', slowMode);
    speak('Hello!');
  });
  $('#countSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    qCount = +b.dataset.n; store.set('qCount', qCount); renderHome();
  });
  $('#modeBtns').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.mode === 'cards') openCards(); else startGame(b.dataset.mode);
  });

  /* ================= 遊戲 ================= */

  const MODES = {
    pic:   { hint: '按喇叭聽單字，再選出圖片！', min: 4 },
    word:  { hint: '按喇叭聽單字，再選出正確的字！', min: 4 },
    spell: { hint: '聽完把單字打出來，按 Enter 確認！', min: 1 },
  };

  let game = null;
  let lastGame = null;   // 記住上一局的設定，給「再玩一次」「只練答錯的」用

  // reviewWords：只練這些字（複習答錯的）；沒給就從題庫隨機出 qCount 題
  function startGame(mode, reviewWords = null) {
    if (bank.length < MODES[mode].min) {
      confirmBox(`題庫至少要有 ${MODES[mode].min} 個單字才能玩這個模式喔！要去題庫管理加單字嗎？`)
        .then(ok => { if (ok) openBank(); });
      return;
    }
    let order;
    if (reviewWords) {
      order = shuffle(reviewWords.map(w => bank.find(b => b.word === w) || { word: w }));
    } else {
      // 先把題庫洗牌，不夠題數就再洗一輪接上（避免連續重複）
      order = [];
      while (order.length < qCount) {
        const next = shuffle(bank);
        if (order.length && next[0].word === order[order.length - 1].word) next.push(next.shift());
        order = order.concat(next);
      }
      order = order.slice(0, qCount);
    }
    unlockSpeech();
    lastGame = { mode, reviewWords };
    game = { mode, review: !!reviewWords, order, total: order.length, idx: 0, stars: 0, streak: 0, answered: false, wrong: [] };
    $('#gLevel').textContent = game.review ? '複習' : `第 ${level} 關`;
    $('#gTotal').textContent = game.total;
    $('#choices').style.display = mode === 'spell' ? 'none' : '';
    $('#choices').classList.toggle('words', mode === 'word');
    $('#spell').classList.toggle('show', mode === 'spell');
    if (puzzle.n >= PUZZLE_PIECES.length) { puzzle.n = 0; store.set('puzzle', puzzle); }   // 上次拼好了，換新的一個
    renderPuzzle($('#gPuzzle'), puzzle.n);
    $('#gPzLabel').textContent = puzzleLabel();
    show('game');
    if (mode === 'pic') bank.forEach(item => getImageList(item));   // 預先載入圖片
    nextQuestion();
  }

  function nextQuestion() {
    const g = game;
    const target = g.order[g.idx];
    g.answered = false;
    $('#btnNext').style.display = 'none';
    $('#gQ').textContent = g.idx + 1;
    $('#gBar').style.width = (g.idx / g.total * 100) + '%';
    $('#gStars').textContent = '★ ' + g.stars;
    setHint(MODES[g.mode].hint);

    if (g.mode === 'spell') {
      const input = $('#spellInput');
      input.value = '';
      input.className = 'spell-input';
      input.readOnly = false;
      $('#spellFeedback').innerHTML = '';
      $('#btnSpellOk').style.display = '';
      input.focus();
    } else {
      const others = shuffle(bank.filter(b => b.word !== target.word)).slice(0, 3);
      const options = shuffle([target, ...others]);
      const box = $('#choices');
      box.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.dataset.word = opt.word;
        btn.innerHTML = `<span class="word-tag"></span><span class="mark"></span>`;
        btn.querySelector('.word-tag').textContent = opt.word;
        btn.addEventListener('click', () => chooseOption(btn));
        box.appendChild(btn);
        if (g.mode === 'word') {
          const w = document.createElement('span');
          w.className = 'word-big';
          w.textContent = opt.word;
          btn.prepend(w);
        } else {
          btn.classList.add('loading');
          getImageList(opt).then(list => renderPicture(btn, list, opt.word)).then(() => btn.classList.remove('loading'));
        }
      });
    }
    sayLater(target.word, 450);
  }

  function chooseOption(btn) {
    const g = game;
    if (!g || g.answered) return;
    const target = g.order[g.idx];
    const right = btn.dataset.word === target.word;
    btn.classList.add(right ? 'correct' : 'wrong');
    btn.querySelector('.mark').textContent = right ? '✓' : '✕';
    document.querySelectorAll('.choice').forEach(c => {
      if (c === btn) return;
      if (!right && c.dataset.word === target.word) { c.classList.add('reveal'); c.querySelector('.mark').textContent = '✓'; }
      else c.classList.add('dim');
    });
    answered(right, btn);
  }

  function submitSpelling() {
    const g = game;
    if (!g || g.mode !== 'spell') return;
    if (g.answered) return goNext();             // 答完後再按 Enter = 下一題
    const input = $('#spellInput');
    const typed = input.value.trim().toLowerCase();
    if (!typed) { input.focus(); return; }
    const target = g.order[g.idx].word;
    const right = typed === target.toLowerCase();
    input.classList.add(right ? 'right' : 'wrong');
    input.readOnly = true;
    $('#btnSpellOk').style.display = 'none';
    const fb = $('#spellFeedback');
    fb.innerHTML = '';
    if (right) {
      fb.innerHTML = '<span class="ok">拼對了！</span>';
    } else {
      // 逐字母比對，拼錯的字母標紅
      const line = document.createElement('div');
      line.append('你打的：');
      [...typed].forEach((ch, i) => {
        const sp = document.createElement('span');
        sp.className = ch === target[i] ? 'ok' : 'bad';
        sp.textContent = ch;
        line.appendChild(sp);
      });
      const ans = document.createElement('div');
      ans.innerHTML = '正確答案：<span class="ans ok"></span>';
      ans.querySelector('.ans').textContent = target;
      fb.append(line, ans);
    }
    answered(right, input);
    input.focus();   // 讓 Enter 可以直接進下一題
  }

  // 共用的答題回饋
  function answered(right, el) {
    const g = game;
    const target = g.order[g.idx];
    g.answered = true;
    if (right) {
      g.stars++; g.streak++;
      totalStars++; store.set('stars', totalStars);
      flyStar(el);
      setTimeout(() => { if (game === g) $('#gStars').textContent = '★ ' + g.stars; }, 700);
      const finished = addPuzzlePiece();
      if (finished) {
        sfx.win();
        showBanner('人偶拼好了！');
        [0, 300, 600].forEach(t => setTimeout(() => confetti(innerWidth * (0.25 + Math.random() * 0.5), innerHeight * 0.35, 90, 1.4), t));
      } else if (g.streak >= 3) {
        sfx.combo();
        showBanner(g.streak === g.total ? '全部答對！' : `連續答對 ${g.streak} 題`);
        confetti(innerWidth / 2, innerHeight * 0.4, 70 + Math.min(g.streak, 10) * 10, 1.3);
      } else {
        sfx.good();
        const r = el.getBoundingClientRect();
        confetti(r.left + r.width / 2, r.top + r.height / 2, 35);
      }
      setHint(['答對了！', '好棒！', '完全正確！', '太厲害了！'][Math.random() * 4 | 0], 'good');
      sayLater(target.word, 350);
    } else {
      g.streak = 0;
      if (!g.wrong.includes(target.word)) g.wrong.push(target.word);
      sfx.bad();
      setHint(`正確答案是 ${target.word}`, 'bad');
      sayLater(target.word, 600);   // 答錯再唸一次正確答案
    }
    $('#btnNext').textContent = g.idx + 1 >= g.total ? '看成績' : '下一題';
    $('#btnNext').style.display = 'inline-flex';
  }

  // 延遲朗讀：如果期間已換題就不唸，避免唸到上一題的字
  let sayTimer = null;
  function sayLater(word, ms) {
    clearTimeout(sayTimer);
    sayTimer = setTimeout(() => speak(word), ms);
  }

  function goNext() {
    clearTimeout(sayTimer);
    if (!game || !game.answered) return;
    game.idx++;
    if (game.idx >= game.total) finishGame();
    else nextQuestion();
  }

  function finishGame() {
    const g = game;
    const s = g.stars, total = g.total;
    const need = Math.ceil(total * 0.6);
    const passed = s >= need;
    $('#banner').classList.remove('show');
    $('#gBar').style.width = '100%';
    $('#spellInput').blur();

    const rs = $('#rStars');
    rs.innerHTML = '';
    for (let i = 0; i < total; i++) {
      const sp = document.createElement('span');
      sp.textContent = '★';
      if (i < s) { sp.className = 'on'; sp.style.animationDelay = (i * 0.1) + 's'; }
      rs.appendChild(sp);
    }

    if (g.review) {
      $('#rTitle').textContent = s === total ? '全部練會了！' : '複習完成';
    } else {
      $('#rTitle').textContent = s === total ? '滿分！' : passed ? `第 ${level} 關過關！` : '再試一次';
    }
    $('#rMsg').textContent = `答對 ${s} / ${total} 題，拿到 ${s} 顆星星（總共 ${totalStars} 顆）`
      + (!g.review && !passed ? `，答對 ${need} 題就能過關喔！` : '');

    const list = $('#wrongList');
    list.innerHTML = '';
    g.wrong.forEach(w => {
      const b = document.createElement('button');
      b.textContent = w;
      b.onclick = () => speak(w);
      list.appendChild(b);
    });
    $('#wrongBox').style.display = g.wrong.length ? 'block' : 'none';
    $('#btnReview').style.display = g.wrong.length ? '' : 'none';
    $('#btnReview').textContent = `只練答錯的（${g.wrong.length}）`;
    $('#btnReview').onclick = () => startGame(g.mode, g.wrong.slice());
    $('#btnNextLevel').style.display = passed && !g.review ? '' : 'none';
    $('#btnRetry').textContent = g.review ? '再複習一次' : '再玩一次';

    renderPuzzle($('#rPuzzle'), puzzle.n);
    $('#rPzLabel').textContent = puzzleLabel();

    if (passed && !g.review) { level++; store.set('level', level); }
    game = null;
    show('result');
    if (passed) {
      sfx.win();
      speak(s === total ? 'Perfect! Great job!' : 'Great job!');
      [0, 400, 800].forEach(t => setTimeout(() => confetti(innerWidth * (0.25 + Math.random() * 0.5), innerHeight * 0.3, 90, 1.4), t));
    } else {
      speak('Good try!');
    }
  }

  const currentWord = () => game && game.order[game.idx].word;
  $('#btnSpeak').onclick = () => { if (game) speak(currentWord()); };
  $('#btnSlow').onclick = () => { if (game) speak(currentWord(), true); };
  $('#btnNext').onclick = goNext;
  $('#btnSpellOk').onclick = submitSpelling;
  $('#spellInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submitSpelling(); }
  });
  $('#btnHome').onclick = async () => {
    if (await confirmBox('要離開這一關回到首頁嗎？')) { clearTimeout(sayTimer); speechSynthesis.cancel(); game = null; renderHome(); show('home'); }
  };
  $('#btnNextLevel').onclick = () => startGame(lastGame.mode);
  $('#btnRetry').onclick = () => startGame(lastGame.mode, lastGame.reviewWords);
  $('#btnResultHome').onclick = () => { renderHome(); show('home'); };

  /* ================= 單字卡 ================= */

  let deck = null;   // { order: [...], i }

  function openCards() {
    if (!bank.length) {
      confirmBox('題庫裡還沒有單字喔！要去題庫管理加單字嗎？').then(ok => { if (ok) openBank(); });
      return;
    }
    unlockSpeech();
    deck = { order: bank.slice(), i: 0 };
    show('cards');
    renderCard();
  }

  function renderCard() {
    const item = deck.order[deck.i];
    const card = $('#flashcard');
    // 換卡時先瞬間翻回正面，避免背面露出下一張的字
    card.classList.add('instant');
    card.classList.remove('flipped');
    void card.offsetWidth;
    card.classList.remove('instant');

    $('#cardWord').textContent = item.word;
    $('#cardPos').textContent = `${deck.i + 1} / ${deck.order.length}`;
    $('#cardBar').style.width = ((deck.i + 1) / deck.order.length * 100) + '%';
    const pic = $('#cardPic');
    pic.innerHTML = '';
    getImageList(item).then(list => {
      if (deck && deck.order[deck.i] === item) renderPicture(pic, list, item.word);
    });
    const next = deck.order[(deck.i + 1) % deck.order.length];
    getImageList(next);   // 預先載入下一張
    sayLater(item.word, 300);
  }

  function moveCard(step) {
    if (!deck) return;
    deck.i = (deck.i + step + deck.order.length) % deck.order.length;
    renderCard();
  }

  function flipCard() {
    const card = $('#flashcard');
    card.classList.toggle('flipped');
    if (card.classList.contains('flipped')) sayLater(deck.order[deck.i].word, 250);
  }

  // 點一下翻面；左右滑動換卡
  let swipeX = null, swiped = false;
  $('#flashcard').addEventListener('pointerdown', e => { swipeX = e.clientX; swiped = false; });
  $('#flashcard').addEventListener('pointerup', e => {
    if (swipeX == null) return;
    const dx = e.clientX - swipeX;
    swipeX = null;
    if (Math.abs(dx) > 60) { swiped = true; moveCard(dx < 0 ? 1 : -1); }
  });
  $('#flashcard').addEventListener('click', () => { if (!swiped) flipCard(); swiped = false; });
  $('#cardPrev').onclick = () => moveCard(-1);
  $('#cardNext').onclick = () => moveCard(1);
  $('#cardSpeak').onclick = () => { if (deck) speak(deck.order[deck.i].word); };
  $('#btnCardShuffle').onclick = () => { if (!deck) return; deck.order = shuffle(deck.order); deck.i = 0; renderCard(); };
  $('#btnCardsBack').onclick = () => { clearTimeout(sayTimer); speechSynthesis.cancel(); deck = null; renderHome(); show('home'); };
  addEventListener('keydown', e => {
    if (!deck || !$('#cards').classList.contains('active')) return;
    if (e.key === 'ArrowRight') moveCard(1);
    else if (e.key === 'ArrowLeft') moveCard(-1);
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  });

  /* ================= 題庫管理 ================= */

  function openBank() { renderBank(); show('bank'); }
  $('#btnBank').onclick = openBank;
  $('#btnBankBack').onclick = () => { renderHome(); show('home'); };

  function renderBank() {
    $('#bankCount').textContent = `共 ${bank.length} 個單字` + (bank.length < 4 ? '（至少需要 4 個）' : '');
    const grid = $('#bankGrid');
    grid.innerHTML = '';
    bank.forEach(item => {
      const el = document.createElement('div');
      el.className = 'bank-item';
      el.innerHTML = `
        <div class="thumb"></div>
        <div class="w"></div>
        <div class="acts">
          <button data-act="say">發音</button>
          <button data-act="next">換圖</button>
          <button data-act="url">網址</button>
          <button data-act="del">刪除</button>
        </div>`;
      el.querySelector('.w').textContent = item.word;
      const thumb = el.querySelector('.thumb');
      getImageList(item).then(list => renderPicture(thumb, list, item.word));
      el.querySelector('.acts').addEventListener('click', e => bankAction(e, item, thumb));
      grid.appendChild(el);
    });
  }

  async function bankAction(e, item, thumb) {
    const act = e.target.closest('button')?.dataset.act;
    if (!act) return;
    if (act === 'say') speak(item.word);
    if (act === 'del') {
      if (await confirmBox(`要刪除「${item.word}」嗎？`)) {
        bank = bank.filter(b => b !== item); saveBank(); renderBank();
      }
    }
    if (act === 'url') {
      const url = prompt(`貼上「${item.word}」的圖片網址（留空則恢復自動找圖）：`, item.img || '');
      if (url === null) return;
      item.img = url.trim() || undefined;
      saveBank();
      renderPicture(thumb, await getImageList(item), item.word);
    }
    if (act === 'next') {
      // 換一張：自訂圖片優先清除；emoji 的字改用網路搜尋
      delete item.img; saveBank();
      let c = imgCache[item.word];
      if (!c) {
        const pic = PICTURES[item.word];
        thumb.innerHTML = '<div class="txt-fallback">…</div>';
        const list = await searchOpenverse(pic && pic.q ? pic.q : item.word);
        if (!list.length) { renderPicture(thumb, await getImageList(item), item.word); return alert('找不到其他圖片，可以按「網址」貼上自己的圖片。'); }
        c = imgCache[item.word] = { list, i: 0 };
      } else {
        c.i = (c.i + 1) % c.list.length;
      }
      saveCache();
      renderPicture(thumb, rotate(c.list, c.i), item.word);
    }
  }

  function addWords(words) {
    const existing = new Set(bank.map(b => b.word));
    let added = 0;
    words.forEach(w => {
      w = w.toLowerCase().trim();
      if (!/^[a-z][a-z'-]*[a-z]$|^[a-z]$/.test(w) || existing.has(w)) return;
      existing.add(w); bank.push({ word: w }); added++;
    });
    saveBank(); renderBank();
    return added;
  }

  $('#btnAddOne').onclick = () => {
    const input = $('#oneWord');
    const n = addWords([input.value]);
    if (n) { input.value = ''; speak(bank[bank.length - 1].word); }
    else alert('請輸入新的英文單字（不可重複）');
  };
  $('#oneWord').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnAddOne').click(); });

  $('#btnAddBatch').onclick = () => {
    const words = $('#batchText').value.split(/[^A-Za-z'-]+/).filter(Boolean);
    if (!words.length) return alert('框框裡還沒有單字喔');
    const n = addWords(words);
    alert(n ? `已加入 ${n} 個新單字！` : '這些單字都已經在題庫裡了');
    if (n) $('#batchText').value = '';
  };

  $('#btnResetBank').onclick = async () => {
    if (await confirmBox('要恢復成預設的 20 個單字嗎？（自己加的單字會被移除）')) {
      bank = DEFAULT_WORDS.map(word => ({ word })); saveBank(); renderBank();
    }
  };

  /* ---------- 拍照辨識（Tesseract.js，用到時才載入） ---------- */

  let tesseractLoading = null;
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve();
    if (!tesseractLoading) {
      tesseractLoading = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
        s.onload = resolve;
        s.onerror = () => { tesseractLoading = null; reject(new Error('load')); };
        document.head.appendChild(s);
      });
    }
    return tesseractLoading;
  }

  $('#btnPhoto').onclick = () => $('#photoInput').click();
  $('#photoInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const preview = $('#photoPreview');
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    const status = $('#ocrStatus');
    status.textContent = '載入辨識工具中…（第一次需要比較久）';
    try {
      await loadTesseract();
      const worker = await Tesseract.createWorker('eng', 1, {
        logger: m => {
          if (m.status === 'recognizing text') status.textContent = `辨識中… ${Math.round(m.progress * 100)}%`;
        }
      });
      await worker.setParameters({ tessedit_char_whitelist: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ \n' });
      const { data } = await worker.recognize(file);
      await worker.terminate();
      const seen = new Set();
      const words = (data.text.match(/[A-Za-z]{2,12}/g) || [])
        .map(w => w.toLowerCase())
        .filter(w => /[aeiouy]/.test(w) && !seen.has(w) && seen.add(w));
      if (!words.length) {
        status.textContent = '沒有辨識到英文字，請再拍清楚一點，或直接在框框裡打字。';
        return;
      }
      const box = $('#batchText');
      box.value = (box.value.trim() ? box.value.trim() + ' ' : '') + words.join(' ');
      status.textContent = `找到 ${words.length} 個字！請檢查拼字，修改後按「全部加入題庫」。`;
      box.focus();
    } catch (err) {
      status.textContent = '辨識失敗（可能沒有網路），請直接在框框裡打字。';
    }
  });

  /* ================= 啟動 ================= */

  renderHome();
})();
