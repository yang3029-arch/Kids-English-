<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>英文小耳朵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #e2681f;
    --accent-press: #c4561a;
    --accent-ink: #c4561a;
    --accent-soft: #fdf1e8;
    --bg: #f4f4f1;
    --surface: #ffffff;
    --ink: #1f1f1f;
    --muted: #8a8a8a;
    --line: #e2e2de;
    --tag: #c8553d;
    --ok: #2e9e62;
    --ok-soft: #eaf6ef;
    --bad: #d2493f;
    --bad-soft: #fbecea;
    --star: #f2b200;
    --fs: 1;
    --en: "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    color: var(--ink); background: var(--bg); min-height: 100vh;
    user-select: none; -webkit-user-select: none; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:active { transform: scale(.97); }
  [hidden] { display: none !important; }
  .en { font-family: var(--en); }
  .muted { color: var(--muted); }

  /* ---------- 頁首 ---------- */
  .app-head { background: var(--surface); border-bottom: 1px solid var(--line); }
  .head-inner { max-width: 860px; margin: 0 auto; padding: 20px 20px 0; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo { height: 80px; width: auto; flex: none; margin: -10px 0 -6px; }
  .brand h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: 3px; }
  .brand h1 .en { font-weight: 800; letter-spacing: 2px; margin-left: 6px; }
  .tabs { display: flex; gap: 4px; margin-top: 18px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: none; padding: 14px 18px 12px; font-size: 20px; font-weight: 600; color: var(--muted);
    border-bottom: 3px solid transparent;
  }
  .tabs button:active { transform: none; }
  .tabs button.on { color: var(--accent-ink); border-bottom-color: var(--accent); }
  .toolbar { display: flex; align-items: center; gap: 12px; padding: 18px 0 20px; flex-wrap: wrap; }
  .outline-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 54px; padding: 0 22px; border-radius: 14px; border: 1.5px solid var(--line);
    background: var(--surface); font-size: 20px; font-weight: 700; color: var(--accent-ink);
  }
  .fs-seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
  .fs-seg button { min-width: 60px; min-height: 51px; font-size: 22px; font-weight: 600; }
  .fs-seg button + button { border-left: 1.5px solid var(--line); }
  .fs-seg button:disabled { color: #c9c9c9; }
  .fs-seg sup { font-size: 14px; }
  .score { margin-left: auto; font-size: 18px; color: var(--muted); white-space: nowrap; }
  .score b { color: var(--star); }

  /* ---------- 內容 ---------- */
  main { max-width: 860px; margin: 0 auto; padding: 22px 20px 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
  .chip {
    min-height: 56px; padding: 0 26px; border-radius: 999px; border: 1.5px solid var(--line);
    background: var(--surface); font-size: 20px; font-weight: 500;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .notice { padding: 16px 20px; margin-bottom: 18px; font-size: 18px; line-height: 1.7; }
  .notice.warn { background: var(--bad-soft); border-color: transparent; color: var(--bad); font-weight: 600; }
  .notice ol { margin: 6px 0 0; padding-left: 24px; color: var(--muted); }
  .primary-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 64px; padding: 0 34px; border-radius: 16px; background: var(--accent); color: #fff;
    font-size: 22px; font-weight: 700;
  }
  .primary-btn:active { background: var(--accent-press); }
  .footer { text-align: center; color: var(--muted); font-size: 16px; padding: 18px 0 30px; }

  /* ---------- 單字卡 ---------- */
  .flashcard { height: clamp(300px, calc(100vh - 470px), 560px); perspective: 1400px; cursor: pointer; touch-action: pan-y; }
  .flash-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,.7,.3,1); }
  .flashcard.flipped .flash-inner { transform: rotateY(180deg); }
  .flashcard.instant .flash-inner { transition: none; }
  .face {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .face.back { transform: rotateY(180deg); gap: 10px; }
  .face .tag { position: absolute; top: 22px; right: 26px; color: var(--tag); font-weight: 700; font-size: 18px; font-family: var(--en); }
  .face .tip { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: 18px; }
  .flash-word { font-family: var(--en); font-weight: 800; font-size: calc(clamp(52px, 12vw, 96px) * var(--fs)); letter-spacing: 1px; text-align: center; word-break: break-word; }
  .flash-pic { max-width: 100%; max-height: 58%; object-fit: contain; border-radius: 16px; margin-bottom: 8px; pointer-events: none; }
  .face.front.has-pic .flash-word { font-size: calc(clamp(40px, 9vw, 68px) * var(--fs)); }
  .pic-btn {
    position: absolute; top: 16px; left: 18px; min-height: 44px; padding: 0 14px; border-radius: 12px;
    border: 1.5px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 600; color: var(--accent-ink);
  }
  .flash-zh { font-size: calc(clamp(44px, 10vw, 72px) * var(--fs)); font-weight: 700; text-align: center; }
  .flash-zh.none { font-size: 20px; font-weight: 500; color: var(--muted); }
  .flash-sub { font-family: var(--en); font-size: calc(28px * var(--fs)); font-weight: 700; color: var(--muted); }
  .card-nav { display: grid; grid-template-columns: 1fr auto auto 1fr; align-items: center; gap: 14px; margin-top: 18px; }
  .nav-btn {
    min-height: 64px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--surface);
    font-size: 21px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  }
  .round-btn {
    width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface);
    color: var(--accent); display: inline-flex; align-items: center; justify-content: center;
  }
  .round-btn svg { width: 28px; height: 28px; }
  .pos { font-family: var(--en); font-size: 26px; font-weight: 800; padding: 0 6px; white-space: nowrap; }

  /* ---------- 測驗 ---------- */
  .setup-card, .result-card { padding: 28px 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .setup-card h2, .result-card h2 { margin: 0; font-size: 28px; font-weight: 800; }
  .setup-card p { margin: 0; font-size: 19px; color: var(--muted); line-height: 1.6; }
  .quiz-card { padding: 20px 22px 24px; }
  .quiz-top { display: flex; align-items: center; gap: 12px; font-size: 18px; color: var(--muted); font-weight: 600; }
  .quiz-top .star-count { margin-left: auto; color: var(--star); font-size: 22px; font-weight: 800; }
  .star-count.pop { animation: pop .45s; }
  .text-btn { font-size: 18px; color: var(--muted); padding: 8px 4px; text-decoration: underline; text-underline-offset: 4px; }
  .progress { height: 6px; background: #ececea; border-radius: 999px; overflow: hidden; margin-top: 12px; }
  .progress > div { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .4s; }
  .speaker-zone { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 24px 0 20px; }
  .speaker-row { display: flex; align-items: center; gap: 14px; }
  .speaker {
    width: 112px; height: 112px; border-radius: 50%; background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .speaker svg { width: 48px; height: 48px; }
  .speaker:active { background: var(--accent-press); }
  .speaker.talking, .round-btn.talking { animation: pulse .9s ease-in-out infinite; }
  .slow-btn { min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1.5px solid var(--line); font-size: 18px; font-weight: 600; color: var(--muted); }
  .hint { font-size: 19px; font-weight: 600; color: var(--muted); min-height: 28px; text-align: center; }
  .hint.good { color: var(--ok); }
  .hint.bad { color: var(--bad); }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .choice {
    position: relative; min-height: 112px; padding: 14px; border-radius: 20px; border: 1.5px solid var(--line);
    background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    transition: border-color .2s, background .2s, opacity .2s;
  }
  .choice .w { font-family: var(--en); font-weight: 800; font-size: calc(clamp(34px, 7vw, 52px) * var(--fs)); pointer-events: none; }
  .choice .zh { font-size: 17px; color: var(--muted); display: none; pointer-events: none; }
  .choice .mark {
    position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%;
    display: none; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #fff;
  }
  .choice.correct, .choice.reveal { border-color: var(--ok); background: var(--ok-soft); }
  .choice.correct { animation: pop .45s; }
  .choice.correct .mark, .choice.reveal .mark { display: flex; background: var(--ok); }
  .choice.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .4s; }
  .choice.wrong .mark { display: flex; background: var(--bad); }
  .choice.correct .zh, .choice.reveal .zh, .choice.wrong .zh { display: block; }
  .choice.dim { opacity: .35; }

  .spell { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; min-height: 84px; }
  .slot {
    width: calc(64px * var(--fs)); height: calc(80px * var(--fs)); border-radius: 14px; background: var(--bg);
    border: 1.5px dashed #cfcfca; display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--en); font-weight: 800; font-size: calc(46px * var(--fs)); color: var(--ink);
  }
  .slot.filled { background: var(--surface); border: 1.5px solid var(--line); border-bottom: 3px solid var(--accent); }
  .slot.next { border-color: var(--accent); }
  .slots.right .slot { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
  .slots.right { animation: pop .45s; }
  .slots.wrong { animation: shake .4s; }
  .slots.wrong .slot.bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
  .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 6px; }
  .tile {
    width: calc(72px * var(--fs)); height: calc(72px * var(--fs)); border-radius: 18px; background: var(--surface);
    border: 1.5px solid var(--line); border-bottom-width: 4px; font-family: var(--en); font-weight: 800;
    font-size: calc(40px * var(--fs)); color: var(--ink); transition: opacity .15s, transform .1s;
  }
  .tile:disabled { opacity: .2; transform: none; }
  .spell-tools { display: flex; gap: 10px; justify-content: center; }
  .spell-tools .outline-btn { min-height: 50px; font-size: 18px; color: var(--muted); }
  .spell-feedback { font-size: 21px; font-weight: 600; text-align: center; line-height: 1.8; color: var(--muted); }
  .spell-feedback .ans { font-family: var(--en); font-size: 40px; font-weight: 800; letter-spacing: 3px; }
  .spell-feedback .ok { color: var(--ok); }
  .spell-feedback .bad { color: var(--bad); text-decoration: underline; text-underline-offset: 5px; }

  .game-foot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-top: 18px; }
  .pz-label { font-size: 17px; font-weight: 600; color: var(--muted); }
  .next-slot { justify-self: end; }

  .result-stars { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; font-size: 36px; line-height: 1; color: #e1e1dd; }
  .result-stars span.on { color: var(--star); animation: pop .5s backwards; }
  .result-msg { font-size: 19px; color: var(--muted); }
  .wrong-box { width: 100%; padding: 16px; border-radius: 18px; background: var(--bg); }
  .wrong-title { font-size: 16px; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
  .wrong-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .wrong-list button { min-height: 50px; padding: 0 20px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--line); font-family: var(--en); font-size: 24px; font-weight: 800; color: var(--bad); }
  .result-btns { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .result-btns .outline-btn { min-height: 60px; }

  /* ---------- 拼圖 ---------- */
  .puzzle { position: relative; height: 140px; aspect-ratio: 520 / 515; }
  .puzzle.big { height: 210px; }
  .pz-shadow, .pz-piece { position: absolute; inset: 0; background: var(--pz) center / 100% 100% no-repeat; }
  .pz-shadow { filter: brightness(0); opacity: .07; }
  .pz-piece { opacity: 0; }
  .pz-piece.on { opacity: 1; }
  .pz-piece.new { animation: pieceIn .9s cubic-bezier(.2,.9,.3,1.25); }
  .puzzle.done { animation: cheer 1s ease; }

  /* ---------- 題庫 ---------- */
  .panel { padding: 22px; margin-bottom: 16px; }
  .panel h3 { margin: 0 0 8px; font-size: 22px; font-weight: 700; }
  .panel p.note { margin: 0 0 14px; color: var(--muted); font-size: 17px; line-height: 1.6; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .text-input, textarea {
    font: inherit; font-size: 22px; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 16px;
    background: var(--bg); color: var(--ink); user-select: text; -webkit-user-select: text;
  }
  .text-input { flex: 1; min-width: 140px; min-height: 56px; }
  textarea { width: 100%; min-height: 110px; resize: vertical; margin-top: 12px; }
  .text-input:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .photo-preview { max-width: 100%; max-height: 220px; border-radius: 14px; margin-top: 12px; display: none; }
  .ocr-status { font-size: 17px; color: var(--muted); margin-top: 8px; min-height: 24px; }
  .word-list { border-top: 1px solid var(--line); }
  .word-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; min-height: 66px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .word-row .thumb { width: 52px; height: 52px; flex: none; border-radius: 10px; object-fit: cover; background: var(--bg); }
  .word-row .thumb.empty { border: 1.5px dashed var(--line); }
  .word-row .w { font-family: var(--en); font-weight: 800; font-size: 24px; min-width: 90px; }
  .word-row .zh { flex: 1; color: var(--muted); font-size: 19px; }
  .word-row .acts { display: flex; gap: 6px; }
  .word-row .acts button { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line); font-size: 16px; font-weight: 600; }
  .word-row .acts button[data-act="del"] { color: var(--bad); }
  .bank-count { font-size: 17px; color: var(--muted); margin-bottom: 10px; }

  /* ---------- 特效 ---------- */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  .banner {
    position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(0); z-index: 60; pointer-events: none;
    background: var(--accent); color: #fff; font-size: clamp(26px, 6vw, 40px); font-weight: 700;
    padding: 18px 38px; border-radius: 999px; width: max-content; max-width: 90vw; text-align: center;
  }
  .banner.show { animation: bannerIn 1.8s ease forwards; }
  .fly-star { position: fixed; font-size: 56px; line-height: 1; color: var(--star); z-index: 55; pointer-events: none; transition: all .7s cubic-bezier(.5,-0.3,.7,1); }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 80; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-bg.show { display: flex; }
  .modal { padding: 26px; width: min(460px, 100%); text-align: center; }
  .modal p { font-size: 21px; font-weight: 600; margin: 0 0 22px; line-height: 1.5; }
  .modal .row { justify-content: center; }

  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
  @keyframes pieceIn { 0% { opacity: 0; transform: translateY(-60%) scale(1.6) rotate(-12deg); } 50% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes cheer { 0%,100% { transform: none; } 25% { transform: scale(1.12) rotate(-4deg); } 50% { transform: scale(1.12) rotate(4deg); } 75% { transform: scale(1.06); } }
  @keyframes bannerIn {
    0% { transform: translate(-50%, -50%) scale(.6); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
    25% { transform: translate(-50%, -50%) scale(1); }
    80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -60%) scale(1); opacity: 0; }
  }

  @media (max-width: 560px) {
    .brand h1 { font-size: 24px; }
    .brand .logo { height: 64px; }
    .tabs button { font-size: 18px; padding: 12px 12px 10px; }
    .card-nav { grid-template-columns: 1fr auto 1fr; }
    .card-nav .pos { grid-column: 1 / -1; grid-row: 1; text-align: center; }
    .nav-btn { font-size: 18px; }
    .puzzle { height: 110px; }
    .puzzle.big { height: 170px; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-speaker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/>
    <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
    <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
  </symbol>
</svg>

<header class="app-head">

          <img class="flash-pic" id="cardPic" alt="" hidden>
          <div class="flash-word" id="cardWord"></div>
          <div class="tip">點卡片翻面</div>
        </div>
        <div class="card face back">
          <div class="flash-sub" id="cardWordBack"></div>
          <div class="flash-zh" id="cardZh"></div>
          <div class="tip">點卡片翻回去</div>
        </div>
      </div>
    </div>
    <div class="card-nav">
      <button class="nav-btn" id="cardPrev">← 上一張</button>
      <button class="round-btn" id="cardSpeak" aria-label="發音"><svg><use href="#i-speaker"/></svg></button>
      <span class="pos" id="cardPos">1 / 20</span>
      <button class="nav-btn" id="cardNext">下一張 →</button>
    </div>
  </section>

  <!-- 聽音選字／聽音拼字 -->
  <section class="panel-tab" id="p-quiz" hidden>
    <div id="qSetup">
      <div class="chips" id="countChips">
        <button class="chip" data-n="5">5 題</button>
        <button class="chip" data-n="10">10 題</button>
        <button class="chip" data-n="15">15 題</button>
        <button class="chip" data-n="20">20 題</button>
        <button class="chip" data-slow>慢速發音</button>
      </div>
      <div class="card setup-card">
        <div class="puzzle big" id="sPuzzle" aria-label="拼圖"></div>
        <div class="pz-label" id="sPzLabel"></div>
        <h2 id="setupTitle"></h2>
        <p id="setupDesc"></p>
        <button class="primary-btn" id="btnStart">開始 →</button>
      </div>
    </div>

    <div id="qPlay" hidden>
      <div class="card quiz-card">
        <div class="quiz-top">
          <span><span id="gLevel">第 1 關</span> · <span id="gQ">1</span> / <span id="gTotal">10</span></span>
          <span class="star-count" id="gStars">★ 0</span>
          <button class="text-btn" id="btnQuit">結束</button>
        </div>
        <div class="progress"><div id="gBar"></div></div>
        <div class="speaker-zone">
          <div class="speaker-row">
            <button class="speaker" id="btnSpeak" aria-label="再聽一次"><svg><use href="#i-speaker"/></svg></button>
          </div>
          <button class="slow-btn" id="btnSlow">慢速再聽</button>
          <div class="hint" id="hint"></div>
        </div>
        <div class="choices" id="choices"></div>
        <div class="spell" id="spell" hidden>
          <div class="slots" id="slots"></div>
          <div class="tiles" id="tiles"></div>
          <div class="spell-tools" id="spellTools">
            <button class="outline-btn" id="btnUndo">← 退一格</button>
            <button class="outline-btn" id="btnClear">全部清除</button>
          </div>
          <div class="spell-feedback" id="spellFeedback"></div>
        </div>
      </div>
      <div class="game-foot">
        <div class="pz-label" id="gPzLabel"></div>
        <div class="puzzle" id="gPuzzle" aria-label="拼圖"></div>
        <div class="next-slot"><button class="primary-btn" id="btnNext" hidden>下一題 →</button></div>
      </div>
    </div>

    <div id="qResult" hidden>
      <div class="card result-card">
        <div class="puzzle big" id="rPuzzle" aria-label="拼圖"></div>
        <div class="pz-label" id="rPzLabel"></div>
        <h2 id="rTitle"></h2>
        <div class="result-stars" id="rStars"></div>
        <div class="result-msg" id="rMsg"></div>
        <div class="wrong-box" id="wrongBox">
          <div class="wrong-title">答錯的單字 · 點一下聽發音</div>
          <div class="wrong-list" id="wrongList"></div>
        </div>
        <div class="result-btns">
          <button class="primary-btn" id="btnReview">只練答錯的</button>
          <button class="primary-btn" id="btnNextLevel">下一關 →</button>
          <button class="outline-btn" id="btnRetry">再玩一次</button>
          <button class="text-btn" id="btnBackSetup">回到設定</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 題庫 -->
  <section class="panel-tab" id="p-bank" hidden>
    <div class="card panel">
      <h3>拍照加入單字</h3>
      <p class="note">拍下單字卡或作業本，系統會自動辨識英文字。手寫字可能會認錯，請在下方框框檢查、修改後再加入。</p>
      <button class="outline-btn" id="btnPhoto">拍照 / 選照片 →</button>
      <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
      <img class="photo-preview" id="photoPreview" alt="">
      <div class="ocr-status" id="ocrStatus"></div>
      <textarea id="batchText" placeholder="也可以直接打字，英文後面可以接中文，例如：cat 貓 dog 狗 pig"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="primary-btn" id="btnAddBatch">全部加入題庫</button>
      </div>
    </div>

    <div class="card panel">
      <h3>加入一個單字</h3>
      <div class="row">
        <input class="text-input" id="oneWord" placeholder="英文" autocomplete="off" autocapitalize="off" spellcheck="false">
        <input class="text-input" id="oneZh" placeholder="中文（可不填）" autocomplete="off">
        <button class="primary-btn" id="btnAddOne">加入</button>
      </div>
    </div>

    <div class="card panel">
      <h3>目前題庫</h3>
      <div class="bank-count" id="bankCount"></div>
      <p class="note">按「圖片」可以拍下自己畫的圖，或從相簿選一張，單字卡上就會出現這張圖。</p>
      <input type="file" id="picInput" accept="image/*" hidden>
      <div class="word-list" id="wordList"></div>
      <div class="row" style="margin-top:18px">
        <button class="outline-btn" id="btnResetBank">恢復預設題庫</button>
      </div>
    </div>
  </section>

  <div class="footer">版本 2026.10.11</div>
</main>

<canvas id="fx"></canvas>
<div class="banner" id="banner"></div>

  </div>

  // 把照片縮小成 400px 的 JPEG，存起來才不會太佔空間
  function shrinkImage(file, max = 400) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k);
        c.height = Math.round(img.naturalHeight * k);
        const g = c.getContext('2d');
        g.fillStyle = '#fff';
        g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
      img.src = url;
    });
  }

  /* ================= 語音 ================= */

  let voice = null;
  function pickVoice() {
    const voices = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
    const prefer = [/samantha/i, /google us english/i, /aria/i, /jenny/i, /karen/i, /en[-_]US/i];
    for (const p of prefer) {
      const v = voices.find(v => p.test(v.name) || p.test(v.lang));
      if (v) return (voice = v);
    }
    voice = voices[0] || null;
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }

  const hasTTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  // LINE、Facebook 等 App 內建的瀏覽器常常不能發聲
  const IN_APP = /Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent);

  // 備用發音：瀏覽器的語音引擎沒有出聲時，改播線上字典的真人發音
  const wordAudio = new Audio();
  const audioUrlCache = {};
  const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
  let actx = null;

  // iOS 需要在按鈕點擊當下先發一次聲，之後自動朗讀才不會被擋
  let unlocked = false;
  function unlockSpeech() {
    if (unlocked) return;
    unlocked = true;
    if (hasTTS) {
      const u = new SpeechSynthesisUtterance('hi');
      u.volume = 0;
      speechSynthesis.speak(u);
    }
    wordAudio.src = SILENT_WAV;
    wordAudio.play().catch(() => {});
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch {}
  }
  ['click', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, unlockSpeech, { capture: true }));

  async function dictionaryAudio(word) {
    if (word in audioUrlCache) return audioUrlCache[word];
    let url = null;
    try {
      const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
      if (res.ok) {
        const list = (await res.json()).flatMap(e => e.phonetics || []).map(ph => ph.audio).filter(Boolean);
        url = list.find(u => /-us\.mp3$/.test(u)) || list[0] || null;
      }
    } catch {}
    return (audioUrlCache[word] = url);
  }

  async function playWordAudio(text, slow) {
    const word = text.trim().toLowerCase();
    if (!/^[a-z][a-z'-]*$/.test(word)) return false;   // 只有單字才有字典發音
    const url = await dictionaryAudio(word);
    if (!url) return false;
    wordAudio.src = url;
    wordAudio.playbackRate = slow ? 0.6 : slowMode ? 0.75 : 1;
    try { await wordAudio.play(); return true; } catch { return false; }
  }

  let speechWatchdog = null;
  let lastSpeechOk = null;   // 給「測試聲音」看：true = 語音引擎有出聲
  function stopSpeech() {
    clearTimeout(speechWatchdog);
    clearTimeout(sayTimer);
    if (hasTTS) speechSynthesis.cancel();
    wordAudio.pause();
  }

  function speak(text, slow = false) {
    clearTimeout(speechWatchdog);
    wordAudio.pause();
    if (!hasTTS) {
      lastSpeechOk = false;
      playWordAudio(text, slow);
      return;
    }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    if (voice) u.voice = voice;
    u.rate = slow ? 0.5 : slowMode ? 0.6 : 0.85;
    u.pitch = 1.05;
    const btns = $$('.speaker, .round-btn');
    let started = false;
    u.onstart = () => { started = true; lastSpeechOk = true; btns.forEach(b => b.classList.add('talking')); };
    u.onend = u.onerror = () => btns.forEach(b => b.classList.remove('talking'));
    const go = () => { speechSynthesis.resume(); speechSynthesis.speak(u); };
    // Chrome 有時 cancel() 後立刻 speak() 會沒聲音，所以等一下再唸
    if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(go, 100); }
    else go();
    // 1.5 秒內語音引擎都沒開始唸，就改用備用發音
    speechWatchdog = setTimeout(() => {
      if (started) return;
      lastSpeechOk = false;
      speechSynthesis.cancel();
      playWordAudio(text, slow);
    }, 1500);
  }

  // 延遲朗讀：如果期間已換題就不唸，避免唸到上一題的字

  /* ================= 音效 ================= */

  function tone(freqs, dur = 0.12, type = 'sine', gap = 0.09) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      freqs.forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        const t = actx.currentTime + i * gap;
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(actx.destination);
        o.start(t); o.stop(t + dur + 0.05);
      });
    } catch {}
  }
  const sfx = {
    good: () => tone([660, 880, 1320], 0.18, 'triangle'),
    bad: () => tone([300, 220], 0.22, 'square', 0.15),
    combo: () => tone([523, 659, 784, 1047, 1319], 0.2, 'triangle', 0.08),
    win: () => tone([523, 659, 784, 1047, 784, 1047], 0.25, 'triangle', 0.13),
  };

  /* ================= 彩帶特效 ================= */

  const canvas = $('#fx'), ctx = canvas.getContext('2d');
  let particles = [], fxRunning = false;
  function resize() { canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; }
  addEventListener('resize', resize); resize();

  function confetti(x, y, count = 60, spread = 1) {
    const colors = ['#e2681f', '#f2b200', '#2e9e62', '#f6c08f', '#5b8fd6', '#c8553d'];
    const d = devicePixelRatio;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = (4 + Math.random() * 9) * spread;
      particles.push({
        x: x * d, y: y * d, vx: Math.cos(a) * s * d, vy: (Math.sin(a) * s - 7) * d,
        w: (8 + Math.random() * 8) * d, h: (5 + Math.random() * 6) * d,
        r: Math.random() * 6, vr: (Math.random() - .5) * .4,
        c: colors[i % colors.length], life: 90 + Math.random() * 40,
        star: Math.random() < .25
      });
    }
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(tick); }
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const d = devicePixelRatio;
    particles = particles.filter(p => p.life > 0 && p.y < canvas.height + 40);
    for (const p of particles) {
      p.vy += 0.35 * d; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life / 30);
      ctx.fillStyle = p.c;
      if (p.star) { ctx.font = `${p.w * 2}px sans-serif`; ctx.fillText('★', -p.w, p.w); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (particles.length) requestAnimationFrame(tick);
    else { fxRunning = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }

  function showBanner(text) {
    const b = $('#banner');
    b.textContent = text;
    b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');

  function flyStar(fromEl) {
    const from = fromEl.getBoundingClientRect(), to = $('#gStars').getBoundingClientRect();
    const s = document.createElement('div');

    s.style.top = (from.top + from.height / 2 - 28) + 'px';

      s.style.transform = 'scale(.5) rotate(360deg)';

  /* ================= 拼圖 ================= */

  function renderPuzzle(el, n, newIdx = -1) {
    if (!el.childElementCount) {
      el.style.setProperty('--pz', `url(${PUZZLE_IMG})`);
      el.innerHTML = '<div class="pz-shadow"></div>' +
        PUZZLE_PIECES.map(p => `<div class="pz-piece" style="clip-path:${p};-webkit-clip-path:${p}"></div>`).join('');
    }
    el.querySelectorAll('.pz-piece').forEach((piece, i) => {
      piece.classList.toggle('on', i < n);

    });
    el.classList.remove('done');
  }

  function puzzleLabel() {
    const total = PUZZLE_PIECES.length;

  }

  // 答對一題：拼上一塊；全部拼好時回傳 true
  function addPuzzlePiece() {
    const total = PUZZLE_PIECES.length;
    if (puzzle.n >= total) puzzle.n = 0;   // 上一個已拼好，開始拼新的一個
    puzzle.n++;
    if (puzzle.n === total) puzzle.done++;
    store.set('puzzle', puzzle);
    const el = $('#gPuzzle');
    renderPuzzle(el, puzzle.n, puzzle.n - 1);
    $('#gPzLabel').textContent = puzzleLabel();
    if (puzzle.n === total) {
      setTimeout(() => { void el.offsetWidth; el.classList.add('done'); }, 700);
      return true;
    }
    return false;
  }

  /* ================= 頁首、分頁、字體大小 ================= */

  const FS_STEPS = [0.85, 1, 1.15, 1.3, 1.45];

  let deck = null;   // { order: [...], i, random }

  function renderCard() {

  /* ================= 測驗 ================= */

  let game = null;
  let lastGame = null;   // 記住上一局的設定，給「再玩一次」「只練答錯的」用

  // reviewWords：只練這些字（複習答錯的）；沒給就從題庫隨機出 qCount 題
  function startGame(mode, reviewWords = null) {
    if (bank.length < MODES[mode].min) {
      confirmBox(`題庫至少要有 ${MODES[mode].min} 個單字才能玩這個模式喔！要去題庫加單字嗎？`)
        .then(ok => { if (ok) setTab('bank'); });
      return;
    }
    let order;
    if (reviewWords) {
      order = shuffle(reviewWords.map(w => bank.find(b => b.word === w) || { word: w }));
    } else {
      // 先把題庫洗牌，不夠題數就再洗一輪接上（避免連續重複）
      order = [];
      while (order.length < qCount) {
        const next = shuffle(bank);
        if (order.length && next[0].word === order[order.length - 1].word) next.push(next.shift());
        order = order.concat(next);
      }
      order = order.slice(0, qCount);
    }
    lastGame = { mode, reviewWords };
    game = { mode, review: !!reviewWords, order, total: order.length, idx: 0, stars: 0, streak: 0, answered: false, wrong: [] };
    $('#gLevel').textContent = game.review ? '複習' : `第 ${level} 關`;
    $('#gTotal').textContent = game.total;
    $('#choices').hidden = mode === 'spell';
    $('#spell').hidden = mode !== 'spell';
    if (puzzle.n >= PUZZLE_PIECES.length) { puzzle.n = 0; store.set('puzzle', puzzle); }
    renderPuzzle($('#gPuzzle'), puzzle.n);
    $('#gPzLabel').textContent = puzzleLabel();
    showQuizView('play');
    scrollTo(0, 0);
    nextQuestion();
  }

  function endGame() {
    game = null;
    stopSpeech();
    $('#banner').classList.remove('show');

  function nextQuestion() {
    const g = game;
    const target = g.order[g.idx];
    g.answered = false;
    $('#btnNext').hidden = true;
    $('#gQ').textContent = g.idx + 1;
    $('#gBar').style.width = (g.idx / g.total * 100) + '%';
    $('#gStars').textContent = '★ ' + g.stars;
    setHint(MODES[g.mode].hint);

    if (g.mode === 'spell') {
      setupSpelling(target.word);
    } else {
      const others = shuffle(bank.filter(b => b.word !== target.word)).slice(0, 3);
      const options = shuffle([target, ...others]);
      const box = $('#choices');
      box.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.dataset.word = opt.word;
        btn.innerHTML = '<span class="w"></span><span class="zh"></span><span class="mark"></span>';
        btn.querySelector('.w').textContent = opt.word;
        btn.querySelector('.zh').textContent = zhOf(opt);
        btn.addEventListener('click', () => chooseOption(btn));
        box.appendChild(btn);
      });
    }
    sayLater(target.word, 450);
  }

  function chooseOption(btn) {
    const g = game;
    if (!g || g.answered) return;
    const target = g.order[g.idx];
    const right = btn.dataset.word === target.word;
    btn.classList.add(right ? 'correct' : 'wrong');
    btn.querySelector('.mark').textContent = right ? '✓' : '✕';
    $$('.choice').forEach(c => {
      if (c === btn) return;
      if (!right && c.dataset.word === target.word) { c.classList.add('reveal'); c.querySelector('.mark').textContent = '✓'; }
      else c.classList.add('dim');
    });
    answered(right, btn);
  }

  /* ---------- 聽音拼字：點選打散的字母 ---------- */

  function setupSpelling(word) {
    const g = game;
    const letters = [...word];
    let mixed = shuffle(letters);
    // 打散後不要剛好跟答案一樣（全部同一個字母的字除外）
    for (let i = 0; i < 20 && mixed.join('') === word && new Set(letters).size > 1; i++) mixed = shuffle(letters);
    g.tiles = mixed;
    g.picked = [];   // 依序點了哪幾塊字母（存 tiles 的索引）
    $('#spellFeedback').innerHTML = '';
    $('#spellTools').hidden = false;
    $('#tiles').hidden = false;
    $('#slots').className = 'slots';
    renderSpelling();
  }

  function renderSpelling(badIdx = []) {
    const g = game;
    const n = g.tiles.length;
    const slots = $('#slots');
    slots.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const sp = document.createElement('button');
      const t = g.picked[i];
      sp.className = 'slot' + (t != null ? ' filled' : '') + (i === g.picked.length && !g.answered ? ' next' : '') + (badIdx.includes(i) ? ' bad' : '');
      sp.textContent = t != null ? g.tiles[t] : '';
      sp.disabled = g.answered || t == null;
      sp.onclick = () => { g.picked.splice(i, 1); renderSpelling(); };   // 點已放上的字母 = 拿回來
      slots.appendChild(sp);
    }
    const tiles = $('#tiles');
    tiles.innerHTML = '';
    g.tiles.forEach((ch, idx) => {
      const b = document.createElement('button');
      b.className = 'tile';
      b.textContent = ch;
      b.disabled = g.answered || g.picked.includes(idx);
      b.onclick = () => pickTile(idx);
      tiles.appendChild(b);
    });
  }

  function pickTile(idx) {
    const g = game;
    if (!g || g.mode !== 'spell' || g.answered || g.picked.includes(idx) || g.picked.length >= g.tiles.length) return;
    g.picked.push(idx);
    tone([520 + g.picked.length * 60], 0.08, 'triangle');
    renderSpelling();
    if (g.picked.length === g.tiles.length) setTimeout(checkSpelling, 250);
  }

  function checkSpelling() {
    const g = game;
    if (!g || g.answered || g.picked.length !== g.tiles.length) return;
    const item = g.order[g.idx], target = item.word;
    const typed = g.picked.map(i => g.tiles[i]).join('');
    const right = typed === target;
    g.answered = true;
    const bad = [...typed].map((ch, i) => ch === target[i] ? -1 : i).filter(i => i >= 0);
    renderSpelling(bad);
    $('#slots').classList.add(right ? 'right' : 'wrong');
    $('#spellTools').hidden = true;
    $('#tiles').hidden = true;
    const fb = $('#spellFeedback');
    fb.innerHTML = '';
    const zh = zhOf(item);
    if (right) {
      fb.innerHTML = '<span class="ok">拼對了！</span>';
      if (zh) fb.append('　' + zh);
    } else {
      const ans = document.createElement('div');
      ans.innerHTML = '正確答案：<span class="ans ok"></span>';
      ans.querySelector('.ans').textContent = target;
      if (zh) ans.append('　' + zh);
      fb.append(ans);
    }
    answered(right, $('#slots'));
  }

  $('#btnUndo').onclick = () => { const g = game; if (g && !g.answered && g.picked.length) { g.picked.pop(); renderSpelling(); } };
  $('#btnClear').onclick = () => { const g = game; if (g && !g.answered) { g.picked = []; renderSpelling(); } };

  // 有實體鍵盤時：打字母 = 點那塊字母，Backspace = 退一格，Enter = 下一題
  addEventListener('keydown', e => {
    const g = game;
    if (!g || g.mode !== 'spell' || tab !== 'spell' || $('#modal').classList.contains('show')) return;
    if (e.key === 'Enter' && g.answered) { e.preventDefault(); goNext(); return; }
    if (g.answered) return;
    if (e.key === 'Backspace') { e.preventDefault(); $('#btnUndo').click(); return; }
    if (e.key.length === 1) {
      const idx = g.tiles.findIndex((ch, i) => ch === e.key.toLowerCase() && !g.picked.includes(i));
      if (idx >= 0) pickTile(idx);
    }
  });

  // 共用的答題回饋
  function answered(right, el) {
    const g = game;
    const target = g.order[g.idx];
    g.answered = true;

      g.stars++; g.streak++;

      g.streak = 0;
      if (!g.wrong.includes(target.word)) g.wrong.push(target.word);

      setHint(`正確答案是 ${target.word}`, 'bad');

    }

    $('#btnNext').hidden = false;

  function goNext() {
    clearTimeout(sayTimer);
    if (!game || !game.answered) return;
    game.idx++;
    if (game.idx >= game.total) finishGame();
    else nextQuestion();
  }

  function finishGame() {
    const g = game;
    const s = g.stars, total = g.total;
    const need = Math.ceil(total * 0.6);
    const passed = s >= need;
    $('#banner').classList.remove('show');

    const rs = $('#rStars');
    rs.innerHTML = '';
    for (let i = 0; i < total; i++) {

    if (g.review) {
      $('#rTitle').textContent = s === total ? '全部練會了！' : '複習完成';
    } else {
      $('#rTitle').textContent = s === total ? '滿分！' : passed ? `第 ${level} 關過關！` : '再試一次';
    }
    $('#rMsg').textContent = `答對 ${s} / ${total} 題，拿到 ${s} 顆星星（總共 ${totalStars} 顆）`
      + (!g.review && !passed ? `，答對 ${need} 題就能過關喔！` : '');

    const list = $('#wrongList');
    list.innerHTML = '';
    g.wrong.forEach(w => {
      const b = document.createElement('button');
      b.textContent = w;
      b.onclick = () => speak(w);
      list.appendChild(b);
    });
    $('#wrongBox').hidden = !g.wrong.length;
    $('#btnReview').hidden = !g.wrong.length;
    $('#btnReview').textContent = `只練答錯的（${g.wrong.length}）`;
    $('#btnReview').onclick = () => startGame(g.mode, g.wrong.slice());
    $('#btnNextLevel').hidden = !(passed && !g.review);
    $('#btnRetry').textContent = g.review ? '再複習一次' : '再玩一次';

    renderPuzzle($('#rPuzzle'), puzzle.n);
    $('#rPzLabel').textContent = puzzleLabel();

    if (passed && !g.review) { level++; store.set('level', level); }
    game = null;
    renderTop();
    showQuizView('result');
    scrollTo(0, 0);
    if (passed) {
      sfx.win();
      speak(s === total ? 'Perfect! Great job!' : 'Great job!');
      [0, 400, 800].forEach(t => setTimeout(() => confetti(innerWidth * (0.25 + Math.random() * 0.5), innerHeight * 0.3, 90, 1.4), t));
    } else {
      speak('Good try!');
    }
  }

  const currentWord = () => game && game.order[game.idx].word;
  $('#btnStart').onclick = () => startGame(tab);
  $('#btnSpeak').onclick = () => { if (game) speak(currentWord()); };
  $('#btnSlow').onclick = () => { if (game) speak(currentWord(), true); };
  $('#btnNext').onclick = goNext;
  $('#btnQuit').onclick = async () => {
    if (await confirmBox('要結束這一局嗎？')) { endGame(); renderTop(); showSetup(); }
  };
  $('#btnNextLevel').onclick = () => startGame(lastGame.mode);
  $('#btnRetry').onclick = () => startGame(lastGame.mode, lastGame.reviewWords);
  $('#btnBackSetup').onclick = () => { stopSpeech(); showSetup(); };

  /* ================= 題庫 ================= */

  function renderBank() {
    $('#bankCount').textContent = `共 ${bank.length} 個單字` + (bank.length < 4 ? '（聽音選字至少需要 4 個）' : '');
    const list = $('#wordList');
    list.innerHTML = '';
    bank.forEach(item => {
      const row = document.createElement('div');
      row.className = 'word-row';
      const pic = getPic(item.word);
      row.innerHTML = `
        ${pic ? '<img class="thumb" alt="">' : '<span class="thumb empty"></span>'}
        <span class="w"></span>
        <span class="zh"></span>
        <span class="acts">
          <button data-act="say">發音</button>
          <button data-act="zh">中文</button>
          <button data-act="pic">${pic ? '換圖' : '圖片'}</button>
          ${pic ? '<button data-act="unpic">移除圖</button>' : ''}
          <button data-act="del">刪除</button>
        </span>`;
      if (pic) row.querySelector('.thumb').src = pic;
      row.querySelector('.w').textContent = item.word;
      row.querySelector('.zh').textContent = zhOf(item);
      row.querySelector('.acts').addEventListener('click', e => bankAction(e, item));
      list.appendChild(row);
    });
  }

  async function bankAction(e, item) {
    const act = e.target.closest('button')?.dataset.act;
    if (!act) return;
    if (act === 'say') speak(item.word);
    if (act === 'zh') {
      const zh = prompt(`「${item.word}」的中文意思：`, zhOf(item));
      if (zh === null) return;
      item.zh = zh.trim() || undefined;
      saveBank(); renderBank();
    }
    if (act === 'pic') choosePic(item, renderBank);
    if (act === 'unpic') {
      if (await confirmBox(`要移除「${item.word}」的圖片嗎？`)) { setPic(item.word, null); renderBank(); }
    }
    if (act === 'del') {
      if (await confirmBox(`要刪除「${item.word}」嗎？`)) {
        setPic(item.word, null);
        bank = bank.filter(b => b !== item); saveBank(); renderBank(); deck = null;
      }
    }
  }

  // 解析「cat 貓 dog 狗 pig」：英文字開始一個新單字，後面接的中文是它的意思
  function parseWords(text) {
    const items = [];
    text.split(/[\s,，、;；/]+/).filter(Boolean).forEach(tok => {
      if (/^[A-Za-z][A-Za-z'-]*$/.test(tok)) items.push({ word: tok.toLowerCase() });
      else if (items.length) {
        const last = items[items.length - 1];
        last.zh = last.zh ? last.zh + '、' + tok : tok;
      }
    });
    return items;
  }

  function addWords(items) {
    let added = 0;
    items.forEach(({ word, zh }) => {
      if (!/^[a-z][a-z'-]*[a-z]$|^[a-z]$/.test(word)) return;
      const existing = bank.find(b => b.word === word);
      if (existing) { if (zh) existing.zh = zh; return; }
      bank.push({ word, zh }); added++;
    });
    saveBank(); renderBank(); deck = null;
    return added;
  }

  $('#btnAddOne').onclick = () => {
    const word = $('#oneWord').value.trim().toLowerCase();
    const zh = $('#oneZh').value.trim() || undefined;
    if (!/^[a-z][a-z'-]*$/.test(word)) return alert('請輸入英文單字');
    const n = addWords([{ word, zh }]);
    if (!n && !zh) return alert('這個單字已經在題庫裡了');
    $('#oneWord').value = ''; $('#oneZh').value = '';
    speak(word);
  };
  $('#oneWord').addEventListener('keydown', e => { if (e.key === 'Enter') $('#oneZh').focus(); });
  $('#oneZh').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) $('#btnAddOne').click(); });

  $('#btnAddBatch').onclick = () => {
    const items = parseWords($('#batchText').value);
    if (!items.length) return alert('框框裡還沒有單字喔');
    const n = addWords(items);
    alert(n ? `已加入 ${n} 個新單字！` : '這些單字都已經在題庫裡了（中文已更新）');
    $('#batchText').value = '';
  };

  $('#btnResetBank').onclick = async () => {
    if (await confirmBox('要恢復成預設的 20 個單字嗎？（自己加的單字和它們的圖片會被移除）')) {
      bank.forEach(b => { if (!DEFAULT_WORDS.includes(b.word)) setPic(b.word, null); });
      bank = DEFAULT_WORDS.map(word => ({ word })); saveBank(); renderBank(); deck = null;
    }
  };

  /* ---------- 拍照辨識（Tesseract.js，用到時才載入） ---------- */

  let tesseractLoading = null;
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve();
    if (!tesseractLoading) {
      tesseractLoading = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
        s.onload = resolve;
        s.onerror = () => { tesseractLoading = null; reject(new Error('load')); };
        document.head.appendChild(s);
      });
    }
    return tesseractLoading;
  }

  $('#btnPhoto').onclick = () => $('#photoInput').click();
  $('#photoInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const preview = $('#photoPreview');
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    const status = $('#ocrStatus');
    status.textContent = '載入辨識工具中…（第一次需要比較久）';
    try {
      await loadTesseract();
      const worker = await Tesseract.createWorker('eng', 1, {
        logger: m => {
          if (m.status === 'recognizing text') status.textContent = `辨識中… ${Math.round(m.progress * 100)}%`;
        }
      });
      await worker.setParameters({ tessedit_char_whitelist: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ \n' });
      const { data } = await worker.recognize(file);
      await worker.terminate();
      const seen = new Set();
      const words = (data.text.match(/[A-Za-z]{2,12}/g) || [])
        .map(w => w.toLowerCase())
        .filter(w => /[aeiouy]/.test(w) && !seen.has(w) && seen.add(w));
      if (!words.length) {
        status.textContent = '沒有辨識到英文字，請再拍清楚一點，或直接在框框裡打字。';
        return;
      }
      const box = $('#batchText');
      box.value = (box.value.trim() ? box.value.trim() + ' ' : '') + words.join(' ');
      status.textContent = `找到 ${words.length} 個字！請檢查拼字，修改後按「全部加入題庫」。`;
      box.focus();
    } catch (err) {
      status.textContent = '辨識失敗（可能沒有網路），請直接在框框裡打字。';
    }
  });

  /* ================= 啟動 ================= */

  let booted = false;
  renderTop();
  setTab(tab).then(() => { booted = true; });
})();
</script>
</body>
</html>
